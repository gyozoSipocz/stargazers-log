<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal log of starred GitHub repositories.">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <p class="eyebrow">A little corner of GitHub</p>
        <h1>Stargazers <span class="star-icon" aria-hidden="true">✳</span></h1>
        <p class="intro">A log of the repositories I've starred, saved here for a little inspiration.</p>
      </header>

      <section class="list-panel" aria-labelledby="list-title">
        <div class="list-heading">
          <h2 id="list-title">Recently starred</h2>
          <span id="repository-count" aria-live="polite">Loading…</span>
        </div>
        <ul id="repository-list" class="repository-list"></ul>
        <p id="status-message" class="status-message" role="status">Loading starred repositories…</p>
      </section>

      <footer class="site-footer">A small collection of things worth exploring.</footer>
    </main>
  </body>
</html>
